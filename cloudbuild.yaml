steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/telepracticepro-dev/telepracticepro-chatbot', '.']

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/telepracticepro-dev/telepracticepro-chatbot']

  # Step 3: Deploy the image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run', 'deploy', 'telepracticepro-chatbot',          # Name of the service
        '--image', 'gcr.io/telepracticepro-dev/telepracticepro-chatbot',  # Docker image
        "--region=us-central1",
        "--platform=managed",
        "--allow-unauthenticated",
        "--no-use-http2",
        "--cpu=1",  # Allocate 1 CPU
        "--max-instances=1",  # Limit to 1 instance
        "--timeout=1800s",
        "--memory=1Gi",
        "--verbosity=debug",
      ]

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - 'gcr.io/telepracticepro-dev/telepracticepro-chatbot'
