steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/telepracticepro-dev/telepracticepro-chatbot', '.']

  # Step 2: Push the Docker image to Google Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/telepracticepro-dev/telepracticepro-chatbot']

  # Step 3: Deploy the image to Cloud Run
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'run', 'deploy', 'telepracticepro-chatbot',          # Name of the service
        '--image', 'gcr.io/telepracticepro-dev/telepracticepro-chatbot',  # Docker image
        "--region=us-central1",
        "--platform=managed",
        "--allow-unauthenticated",
        "--no-use-http2",
        "--cpu=2",  # Allocate 1 CPU
        "--max-instances=1",  # Limit to 1 instance
        "--timeout=1800s",
        "--memory=2Gi",
        "--verbosity=debug",
      ]

# Specify the Cloud Run service account (optional, remove if unnecessary)
#   This assumes your service account is pre-configured
  - name: 'gcr.io/cloud-builders/gcloud'
    args:
      [
        'iam', 'service-accounts', 'add-iam-policy-binding',
        'telepractice-pro-dev@telepracticepro-dev.iam.gserviceaccount.com',
        '--member=allUsers',
        '--role=roles/run.invoker',
      ]

timeout: 1200s

options:
  logging: CLOUD_LOGGING_ONLY


images:
  - 'gcr.io/telepracticepro-dev/telepracticepro-chatbot'
