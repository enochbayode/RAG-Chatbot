name: CI
on:
  pull_request:
    branches: [ main ]
defaults:
  run:
    working-directory: ./
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11]
    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install build  # Explicitly install build package

      # Add a build step to ensure the code can be built
      - name: Build the project
        run: |
          python -m build

      #- name: Run tests
      #  run: |
      #    pytest

      - name: Black
        run: |
          pip install black
          black . --check

      #- name: Lint code
      #  run: |
      #    flake8 .